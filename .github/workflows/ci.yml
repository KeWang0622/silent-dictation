name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install light dependencies
        run: pip install numpy opencv-python-headless pytest ruff
      - name: Lint
        run: ruff check silentdict tests macos --select F,E9
      - name: Unit tests
        run: pytest -q tests
      - name: Shell scripts parse
        run: bash -n setup.sh && bash -n bin/build-app && bash -n bin/silentdict
      - name: Launcher compiles against Python
        run: clang -fsyntax-only -Wall $(python3-config --includes) macos/launcher.c
      - name: Web UI scripts parse
        run: node --check silentdict/mac/web/app.js
